server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript font/ttf;

    # fonts and data are immutable build artefacts
    location ~* \.(ttf|woff2|json)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

    # assistant / retrieval API (Server-Sent Events: no buffering, long timeouts)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # SPA routes
    location / { try_files $uri /index.html; }
}
